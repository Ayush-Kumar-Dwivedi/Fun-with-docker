version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret_password
      MYSQL_DATABASE: user_db
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - shared-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  registration:
    build: ./registration-app
    ports:
      - "8082:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shared-net

  report:
    build: ./report-app
    ports:
      - "8083:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shared-net

networks:
  shared-net:
    driver: bridge
  
volumes:
  db_data: